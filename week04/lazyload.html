<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lazy Load Images</title>

    <link rel="stylesheet" href="styles/lazyload.css" />
    <script src="scripts/lazyload.js" defer></script>
</head>

<body>

    <main>
        <h1>Lazy Loading Demonstration</h1>

        <img src="https://picsum.photos/400/650?random=1" alt="Random landscape 1" loading="lazy" width="400"
            height="650">

        <img src="https://picsum.photos/400/650?random=2" alt="Random landscape 2" loading="lazy" width="400"
            height="650">

        <img src="https://picsum.photos/400/650?random=3" alt="Random landscape 3" loading="lazy" width="400"
            height="650">

        <img src="https://picsum.photos/400/650?random=4" alt="Random landscape 4" loading="lazy" width="400"
            height="650">

        <img src="https://picsum.photos/400/650?random=5" alt="Random landscape 5" loading="lazy" width="400"
            height="650">

        <img src="https://picsum.photos/400/650?random=6" alt="Random landscape 6" loading="lazy" width="400"
            height="650">
    </main>

    <footer>
        <p>&copy; 2026 Baraka Mujuni | WDD131</p>

    </footer>

</body>

</html>
